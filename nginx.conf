events {}

http {

    include /etc/nginx/mime.types;

    underscores_in_headers on;

    default_type application/octet-stream;

    client_max_body_size 100M;

    # =====================================
    # UPSTREAMS
    # =====================================

    upstream mayan_app {
        server mayan_app:8000;
    }

    upstream flowable_backend {
        server flowable_app:8098;
    }

    # =====================================
    # HTTP SERVER
    # =====================================

    server {

        listen 80;

        # =====================================
        # MAYAN
        # =====================================

        location /mayan/ {

            proxy_pass http://mayan_app/;

            proxy_http_version 1.1;

            proxy_set_header Host $http_host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Host $http_host;

            proxy_set_header X-Forwarded-Port 80;

            proxy_set_header X-Forwarded-Proto http;

            proxy_set_header X-Script-Name /mayan;

            proxy_set_header X-Forwarded-Prefix /mayan;

            proxy_redirect off;
        }

        # =====================================
        # SPRING BOOT API
        # =====================================

        location /flowable-service/ {

            proxy_pass http://flowable_backend/flowable-service/;

            proxy_http_version 1.1;

            proxy_set_header Host $http_host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Host $http_host;

            proxy_set_header X-Forwarded-Port 80;

            proxy_set_header X-Forwarded-Proto http;

            proxy_redirect off;
        }
    }

    # =====================================
    # HTTPS SERVER
    # =====================================

    server {

        listen 443 ssl;

        server_name _;

        ssl_certificate     /etc/nginx/ssl/nlsbanking_com.crt;

        ssl_certificate_key /etc/nginx/ssl/nlsbanking.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        add_header X-Frame-Options SAMEORIGIN;

        add_header X-Content-Type-Options nosniff;

        # =====================================
        # MAYAN
        # =====================================

        location /mayan/ {

            proxy_pass http://mayan_app/;

            proxy_http_version 1.1;

            proxy_set_header Host $http_host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Host $http_host;

            proxy_set_header X-Forwarded-Port 443;

            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header X-Script-Name /mayan;

            proxy_set_header X-Forwarded-Prefix /mayan;

            proxy_redirect off;
        }

        # =====================================
        # SPRING BOOT API
        # =====================================

        location /flowable-service/ {

            proxy_pass http://flowable_backend/flowable-service/;

            proxy_http_version 1.1;

            proxy_set_header Host $http_host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Host $http_host;

            proxy_set_header X-Forwarded-Port 443;

            proxy_set_header X-Forwarded-Proto https;

            proxy_redirect off;
        }

        # =====================================
        # REACT UI
        # =====================================

        location / {

            root /usr/share/nginx/html;

            index index.html;

            try_files $uri $uri/ /index.html;
        }
    }
}