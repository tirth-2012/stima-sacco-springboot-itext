events {}

http {

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  upstream flowable_app {
    server flowable_app:8098;
  }

  upstream mayan_app {
    server mayan_app:8000;
  }

  # =========================
  # HTTP (optional)
  # =========================
  server {
    listen 80;

    # For local dev, you can comment redirect if annoying
    return 301 https://$host$request_uri;
  }

  # =========================
  # HTTPS
  # =========================
  server {
    listen 443 ssl;

    ssl_certificate /etc/nginx/ssl/nlsbanking_com.crt;
    ssl_certificate_key /etc/nginx/ssl/nlsbanking.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 🔐 Security headers (recommended)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # =========================
    # React UI
    # =========================
    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri /index.html;
    }

    # =========================
    # Flowable (FIXED)
    # =========================
    location /flowable-service/ {
      proxy_pass http://flowable_app;   # 👈 FIX

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;  # 👈 IMPORTANT
    }

    # =========================
    # Mayan
    # =========================
    location /mayan/ {
      proxy_pass http://mayan_app;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header X-Forwarded-Port  443;

      proxy_set_header X-Forwarded-Prefix /mayan;

      client_max_body_size 100M;
    }
  }
}