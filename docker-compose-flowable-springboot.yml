#    name: mayan_redis_data

#  mayan_media:
#    external: true
#    name: mayan_mayan_media

  stima_sacco_mayan_media:

  react_build:
    name: react_build

  certbot_www:
    name: certbot_www

  certbot_conf:
    name: certbot_conf

# =========================
# Network
# =========================
networks:
  app-network:
    driver: bridge